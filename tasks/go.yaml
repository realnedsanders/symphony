# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/uds-cli/refs/heads/main/tasks.schema.json

variables:
  - name: SYFT_VERSION
    default: "v1.54.0"
  - name: GRYPE_VERSION
    default: "v0.120.0"
  - name: IMAGE_TAG
    default: "dev"
  - name: GO_IMAGE
    default: "golang:1.26-alpine"

tasks:
  - name: default
    actions:
      - task: all

  - name: all
    actions:
      - task: mod
      - task: fmt
      - task: lint
      - task: test-all
      - task: build
      - task: scan

  - name: mod
    description: Verify go.mod and go.sum are tidy and valid
    actions:
      - cmd: go mod tidy -diff
        dir: src
      - cmd: go mod verify
        dir: src

  - name: fmt
    description: Run golangci-lint formatters
    actions:
      - cmd: golangci-lint fmt
        dir: src

  - name: lint
    description: Run golangci-lint
    actions:
      - cmd: golangci-lint run
        dir: src

  - name: test-all
    description: Run tests
    actions:
      - task: test
      - task: test-race

  - name: test
    description: Run unit and integration tests with coverage
    actions:
      - cmd: go test -failfast -coverprofile=coverage.out -covermode=atomic ./...
        dir: src
      - cmd: go tool cover -func=coverage.out
        dir: src

  - name: test-race
    description: Run tests with go race detector
    actions:
      - cmd: CGO_ENABLED=1 go test -race -failfast ./...
        dir: src

  - name: set-image-tag
    actions:
      - cmd: yq -r '.flavors[] | select(.name == "upstream") | .version | split("-") | .[0]' releaser.yaml
        setVariables:
          - name: IMAGE_TAG

  - name: build
    description: Build the container
    actions:
      - task: set-image-tag
      - task: go-image
        # - cmd: docker buildx build --platform "linux/arm64,linux/amd64" --load --tag "ghcr.io/realnedsanders/symphony:$IMAGE_TAG" .
      - cmd: docker buildx build --build-arg GO_IMAGE=${GO_IMAGE} --platform "linux/amd64" --load --tag "ghcr.io/realnedsanders/symphony:$IMAGE_TAG" .
        dir: src
      - cmd: mkdir -p build
      - cmd: docker save "ghcr.io/realnedsanders/symphony:$IMAGE_TAG" --output build/symphony-$IMAGE_TAG.tar

  - name: scan
    description: Run scanners
    actions:
      - task: govulncheck
      - task: syft
      - task: grype

  - name: govulncheck
    description: Run govulncheck in the Dockerfile Go image
    actions:
      - task: go-image
      - cmd: docker run --rm -v "${PWD}:/src" -w /src ${GO_IMAGE} go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        dir: src

  - name: syft
    description: Run syft
    actions:
      - task: set-image-tag
      - cmd: docker run -v "${PWD}/build:/build" -w "/build" anchore/syft:${SYFT_VERSION} symphony-$IMAGE_TAG.tar -o table -o json=symphony.sbom.json

  - name: grype
    description: Run grype
    actions:
      - task: set-image-tag
      - cmd: docker run -v "${PWD}/build:/build" -w "/build" anchore/grype:${GRYPE_VERSION} symphony-$IMAGE_TAG.tar -o table -o json=symphony.scan.json
