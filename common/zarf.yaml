# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: symphony-common
  description: Symphony chart shared by package flavors

components:
  - name: symphony
    required: true
    charts:
      - name: symphony
        namespace: symphony
        version: 0.1.0
        localPath: ../chart
